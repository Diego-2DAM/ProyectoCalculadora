<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <script src="app.js" defer></script>
    <title>Proyecto Calculadora</title>
    </head>
<body>

    <h1>Proyecto 1: Calculadora</h1>

    <form id="calculadora" novalidate>

        <!-- Pedimos los números los cuales vamos a operar -->
        <label for="numero1">Primer número:</label>
        <input type="number" id="numero1" name="numero1" step="any">

        <label for="numero2">Segundo número:</label>
        <input type="number" id="numero2" name="numero2" step="any">

        <!-- Elegimos la operacion que queremos hacer -->
        <label for="operacion">Operación:</label>
        <select id="operacion" name="operacion">
            <option value="suma">Sumar</option>
            <option value="resta">Restar</option>
            <option value="multiplicacion">Multiplicar</option>
            <option value="division">Dividir</option>
            <option value="potencia">Potencia</option>
            <option value="resto">Resto</option>
        </select>

        <!-- Añadimos los dos botones -->
        <button type="submit">Calcular</button>
        <button type="button" id="limpiar">Limpiar</button>

    </form>

    <!-- Aqui mostraremos los errores junto al resultado obtenido-->
    <p id="error"></p>
    <p id="resultado"></p>


</body>
</html>
